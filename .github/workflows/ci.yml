name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install image and native host tools
        run: |
          brew install coreutils genext2fs libarchive libslirp zig
          echo "$(brew --prefix libarchive)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Select pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Verify toolchain
        run: |
          tools/cargo --version
          tools/cargo clippy --version

      - name: Check formatting
        run: tools/cargo fmt --all -- --check

      - name: Lint
        run: tools/cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: |
          tools/cargo test --workspace --exclude rv64-wasm --release
          tools/cargo test -p rv64-wasm --lib --release

      - name: Build browser module
        run: tools/cargo build -p rv64-wasm --target wasm32-unknown-unknown --release

      - name: Stage browser dependencies
        run: |
          npm ci
          npm run stage-web-dependencies

      - name: Test maintained JavaScript harnesses
        run: |
          node tests/boot-profile-selftest.mjs
          node tests/jit-code-store.mjs
          node tests/host-callback-boundary.mjs
          node tests/public-api.mjs
          node tests/virt-jit.mjs
          node tests/worker-api.mjs

      - name: Test Swift network host
        run: swift test --package-path native -Xswiftc -warnings-as-errors

      - name: Build Alpine assets
        run: web/prepare-images.sh

      - name: Boot Alpine direct machine
        run: node tests/alpine-boot.mjs

      - name: Boot native virt smoke test
        run: tests/virt-smoke/run.sh
